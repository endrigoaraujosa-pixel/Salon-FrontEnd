<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#84A59D"><title>Sem conexão | Salon Studio</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f8f6;color:#3a4f4a;font:16px/1.6 system-ui}main{max-width:380px;margin:24px;padding:36px;border:1px solid #dce7e2;border-radius:24px;background:white;box-shadow:0 16px 60px #3a4f4a12}h1{font-size:24px}p{color:#64746e}button{border:0;border-radius:12px;background:#3a4f4a;color:white;padding:14px 22px;font:inherit;cursor:pointer}button:disabled{opacity:.6}</style><main><small>SALON STUDIO</small><h1>Você está sem conexão</h1><p>Conecte-se à internet para acessar o sistema. Os atendimentos e as fotos precisam de conexão.</p><button id="retry">Tentar novamente</button><p id="status" role="status"></p></main><script>
async function retry(){const button=document.getElementById('retry');button.disabled=true;const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),8000);try{const response=await fetch('/pwa-health.txt',{cache:'no-store',signal:controller.signal});if(!response.ok||(await response.text()).trim()!=='salon-online-v1')throw new Error();location.reload()}catch{document.getElementById('status').textContent='Ainda não foi possível conectar. Tente novamente em instantes.'}finally{clearTimeout(timer);button.disabled=false}}
document.getElementById('retry').addEventListener('click',retry);window.addEventListener('online',retry);
</script></html>
